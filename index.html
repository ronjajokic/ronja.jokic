    <style>
        :root {
            --night: #020817;
            --navy: #051633;
            --royal: #0a2f68;
            --blue-light: #1855a0;
            --gold: #d9b95b;
            --gold-light: #f3df9a;
            --gold-dark: #a77b20;
            --white: #ffffff;
            --soft-white: #e9eef8;
            --muted: #aab7cc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--night);
            color: var(--white);
            font-family: "Manrope", sans-serif;
        }

        a {
            color: inherit;
        }

        a,
        button {
            -webkit-tap-highlight-color: transparent;
        }
