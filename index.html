<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Mama, mir gehört die Welt. Ein Buch von Ronja Jokic über große Träume, Mut, Unternehmertum und den eigenen Weg."
    >

    <meta name="theme-color" content="#020817">

    <title>Mama, mir gehört die Welt. | Ronja Jokic</title>

    <!-- Google Fonts -->
    https://fonts.googleapis.com

    https://fonts.gstatic.com

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?y=Italiana&amp;display=swap

    <style>
        :root {
            --night: #020817;
            --navy: #05152f;
            --royal: #0b3474;

            --gold-dark: #9b6e19;
            --gold: #d8b456;
            --gold-light: #f3df9c;

            --white: #ffffff;
            --soft-white: #edf2fa;
            --muted: #aab7ca;

            --font-title: "Italiana", Georgia, serif;
            --font-body: "DM Sans", Arial, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        * {
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background: var(--night);
            color: var(--white);

            font-family: var(--font-body);
            font-weight: 300;

            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        a:focus-visible {
            outline: 3px solid var(--white);
            outline-offset: 5px;
        }

        ::selection {
            background: var(--gold);
            color: var(--night);
        }

        /* Hintergrund */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(29, 91, 178, 0.38),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 15% 75%,
                    rgba(12, 55, 121, 0.27),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 65%,
                    rgba(8, 39, 91, 0.4),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #020817 0%,
                    #03132f 48%,
                    #071f48 100%
                );
        }

        .background::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                );

            background-size: 85px 85px;

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.65),
                    transparent 88%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.65),
                    transparent 88%
                );
        }

        .background::after {
            content: "";

            position: absolute;
            top: -35%;
            left: 50%;

            width: 70vw;
            height: 70vw;

            border-radius: 50%;

            background: rgba(17, 70, 151, 0.18);
            filter: blur(110px);

            transform: translateX(-50%);

            animation:
                background-breathe
                9s
                ease-in-out
                infinite;
        }

        @keyframes background-breathe {
            0%,
            100% {
                opacity: 0.45;
                transform: translateX(-50%) scale(0.9);
            }

            50% {
                opacity: 0.9;
                transform: translateX(-50%) scale(1.1);
            }
        }

        /* Goldene Lichtpunkte */

        .spark {
            position: absolute;
            display: block;

            border-radius: 50%;
            background: var(--gold-light);

            box-shadow:
                0 0 12px rgba(243, 223, 156, 0.9),
                0 0 30px rgba(216, 180, 86, 0.48);

            animation:
                float-spark
                8s
                ease-in-out
                infinite;
        }

        .spark-one {
            top: 15%;
            left: 11%;
            width: 4px;
            height: 4px;
        }

        .spark-two {
            top: 25%;
            right: 13%;
            width: 6px;
            height: 6px;
            animation-delay: 1.5s;
        }

        .spark-three {
            top: 62%;
            left: 18%;
            width: 3px;
            height: 3px;
            animation-delay: 3s;
        }

        .spark-four {
            right: 20%;
            bottom: 16%;
            width: 4px;
            height: 4px;
            animation-delay: 4.5s;
        }

        .spark-five {
            top: 45%;
            right: 7%;
            width: 3px;
            height: 3px;
            animation-delay: 2.2s;
        }

        .spark-six {
            left: 43%;
            bottom: 8%;
            width: 5px;
            height: 5px;
            animation-delay: 5s;
        }

        @keyframes float-spark {
            0%,
            100% {
                opacity: 0.35;
                transform: translateY(0) scale(0.8);
            }

            50% {
                opacity: 1;
                transform: translateY(-24px) scale(1.35);
            }
        }

        /* Navigation */

        .navigation {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;

            padding:
                calc(24px + env(safe-area-inset-top))
                5vw
                24px;
        }

        .brand {
            font-family: var(--font-title);
            font-size: 1.05rem;
            letter-spacing: 0.02em;
        }

        .brand span {
            color: var(--gold-light);
        }

        .navigation-link {
            position: relative;

            color: var(--soft-white);

            font-size: 0.72rem;
            font-weight: 500;

            letter-spacing: 0.16em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .navigation-link::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: -8px;

            width: 0;
            height: 1px;

            background: var(--gold);

            transition: width 0.35s ease;
        }

        .navigation-link:hover::after,
        .navigation-link:focus-visible::after {
            width: 100%;
        }

        /* Hero */

        .hero {
            position: relative;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                calc(130px + env(safe-area-inset-top))
                24px
                100px;
        }

        .hero-content {
            width: 100%;
            max-width: 1080px;

            text-align: center;
        }

        .eyebrow {
            margin-bottom: 30px;

            color: var(--gold-light);

            font-size: 0.67rem;
            font-weight: 500;

            letter-spacing: 0.34em;
            text-transform: uppercase;

            opacity: 0;

            animation:
                fade-up
                0.9s
                ease
                forwards;
        }

        .title {
            display: flex;
            flex-direction: column;
            align-items: center;

            font-family: var(--font-title);
            font-weight: 400;

            line-height: 0.9;
            letter-spacing: -0.025em;
        }

        .title-line {
            display: block;
            max-width: 100%;

            opacity: 0;
            transform: translateY(45px);

            animation:
                title-reveal
                1.1s
                cubic-bezier(0.2, 0.7, 0.2, 1)
                forwards;
        }

        .title-line:nth-child(1) {
            animation-delay: 0.15s;
        }

        .title-line:nth-child(2) {
            animation-delay: 0.35s;
        }

        .title-line:nth-child(3) {
            animation-delay: 0.55s;
        }

        .title-small {
            font-size: clamp(3rem, 7.5vw, 6.3rem);
        }

        .title-large {
            padding: 0 0.08em;

            font-size: clamp(5.6rem, 16vw, 12rem);
            color: var(--gold-light);

            background:
                linear-gradient(
                    110deg,
                    var(--gold-dark) 0%,
                    var(--gold-light) 35%,
                    #fff4bd 50%,
                    var(--gold) 68%,
                    var(--gold-dark) 100%
                );

            background-size: 220% auto;

            animation:
                title-reveal
                1.1s
                cubic-bezier(0.2, 0.7, 0.2, 1)
                forwards,
                gold-shimmer
                7s
                linear
                infinite;

            animation-delay: 0.55s, 1.6s;
        }

        @supports (
            (-webkit-background-clip: text) or
            (background-clip: text)
        ) {
            .title-large,
            .age-number strong {
                color: transparent;

                -webkit-text-fill-color: transparent;
                -webkit-background-clip: text;
                background-clip: text;
            }
        }

        @keyframes title-reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gold-shimmer {
            0% {
                background-position: 180% center;
            }

            100% {
                background-position: -40% center;
            }
        }

        .gold-divider {
            position: relative;

            width: 130px;
            height: 1px;

            margin: 42px auto 34px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    var(--gold),
                    transparent
                );

            opacity: 0;

            animation:
                fade-up
                0.9s
                ease
                0.85s
                forwards;
        }

        .gold-divider::after {
            content: "";

            position: absolute;
            top: 50%;
            left: 50%;

            width: 7px;
            height: 7px;

            border: 1px solid rgba(255, 255, 255, 0.6);

            background: var(--gold-light);

            box-shadow:
                0 0 22px
                rgba(216, 180, 86, 0.75);

            transform:
                translate(-50%, -50%)
                rotate(45deg);
        }

        .hero-subtitle {
            max-width: 730px;
            margin: 0 auto;

            color: var(--soft-white);

            font-size: clamp(1rem, 2.2vw, 1.25rem);
            line-height: 1.8;

            opacity: 0;

            animation:
                fade-up
                0.9s
                ease
                1s
                forwards;
        }

        /* Buttons */

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;

            gap: 18px;
            margin-top: 44px;

            opacity: 0;

            animation:
                fade-up
                0.9s
                ease
                1.18s
                forwards;
        }

        .button {
            position: relative;
            isolation: isolate;
            overflow: hidden;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 235px;
            min-height: 56px;

            padding: 17px 30px;

            border: 1px solid var(--gold);
            border-radius: 100px;

            font-size: 0.74rem;
            font-weight: 600;

            letter-spacing: 0.11em;
            line-height: 1.25;

            text-align: center;
            text-transform: uppercase;

            transition:
                color 0.35s ease,
                background-color 0.35s ease,
                box-shadow 0.35s ease,
                transform 0.35s ease;
        }

        .button::before {
            content: "";

            position: absolute;
            z-index: -1;
            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 20%,
                    rgba(255, 255, 255, 0.52) 50%,
                    transparent 80%
                );

            transform: translateX(-140%);

            transition: transform 0.8s ease;
        }

        .button:hover,
        .button:focus-visible {
            transform: translateY(-4px);
        }

        .button:hover::before,
        .button:focus-visible::before {
            transform: translateX(140%);
        }

        .button-primary {
            color: var(--night);

            background:
                linear-gradient(
                    135deg,
                    var(--gold-dark),
                    var(--gold-light),
                    var(--gold)
                );

            box-shadow:
                0 14px 38px rgba(216, 180, 86, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .button-secondary {
            color: var(--gold-light);
            background: rgba(3, 15, 39, 0.42);

            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .button-secondary:hover,
        .button-secondary:focus-visible {
            color: var(--night);
            background: var(--gold-light);
        }

        /* Scrollanzeige */

        .scroll-indicator {
            position: absolute;

            left: 50%;
            bottom: 22px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 8px;

            color: var(--muted);

            font-size: 0.56rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;

            opacity: 0;
            transform: translateX(-50%);

            animation:
                fade-up-centered
                1s
                ease
                1.7s
                forwards;
        }

        .scroll-line {
            width: 1px;
            height: 40px;

            background:
                linear-gradient(
                    to bottom,
                    var(--gold),
                    transparent
                );

            animation:
                scroll-pulse
                2s
                ease-in-out
                infinite;
        }

        @keyframes scroll-pulse {
            0%,
            100% {
                opacity: 0.35;

                transform: scaleY(0.5);
                transform-origin: top;
            }

            50% {
                opacity: 1;
                transform: scaleY(1);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

                transform:
